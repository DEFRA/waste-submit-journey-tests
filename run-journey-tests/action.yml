name: Run Journey Tests on GitHub

inputs:
  waste-submit-reg-packaging-fe:
    description: Image tag of waste-submit-reg-packaging-fe to test (default latest)
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
      with:
        repository: DEFRA/waste-submit-journey-tests

    - name: Docker Login
      uses: DEFRA/cdp-build-action/docker-login@main

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Setup the tests
      run: |
        npm ci
        npx playwright install --with-deps chromium
      shell: bash
    - name: Start docker compose
      shell: bash
      run: |
          WASTE_SUBMIT_REG_PACKAGING_FE=${{inputs.waste-submit-reg-packaging-fe}} \
          docker compose up --wait --wait-timeout 300 -d --quiet-pull
    - name: Run the tests
      shell: bash
      run: |
        npm test
        npm run report
    - name: debug
      if: always()
      run: |
        docker compose logs > logs.txt
        docker ps
      shell: bash
    - name: Upload allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: ./logs.txt
