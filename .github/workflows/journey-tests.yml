name: Run Journey Tests on GitHub

permissions:
  checks: write
  pull-requests: write

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      WASTE_SUBMIT_REG_PACKAGING_FE_B2C_CLIENT_SECRET:
        required: true
      EPR_USER_EMAIL:
        required: true
      EPR_USER_PASSWORD:
        required: true
jobs:
  build:
    name: Run Journey Tests
    runs-on: ubuntu-latest
    steps:
      - uses: DEFRA/waste-submit-journey-tests/run-journey-tests@main
        env:
          WASTE_SUBMIT_REG_PACKAGING_FE_B2C_CLIENT_SECRET: ${{ secrets.WASTE_SUBMIT_REG_PACKAGING_FE_B2C_CLIENT_SECRET }}
          EPR_USER_EMAIL: ${{ secrets.EPR_USER_EMAIL }}
          EPR_USER_PASSWORD: ${{ secrets.EPR_USER_PASSWORD }}
