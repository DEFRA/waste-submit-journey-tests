################################################################################
# Docker Compose file for starting up the service for testing in GitHub workflow
# This template provides comparable infrastructure to the real environment.
#   - mongodb
#   - redis
#   - localstack (s3, sqs, sns)
#
# Both mongo and localstack have init scripts included for setting up resources
# on startup. These scripts are in docker/scripts.
#
# Playwright runs the browser on the host (or the GitHub runner), not in a container. Its traffic can go through
# the zap service, for the security scan.
#
# The services being tested can either be started up here using the latest
# builds from dockerhub.
# In the example each service has a .env config file in docker/config/
# Services can reference each other by their container names.
# e.g. http://cdp-example-node-backend:3001/
#
################################################################################
services:

################################################################################
  mongodb:
    image: mongo:6
    volumes:
      - ./docker/scripts/mongodb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 5s
      start_period: 5s
      retries: 3
################################################################################
  localstack:
    image: localstack/localstack:3.2.0
    environment:
      - LOCALSTACK_HOST=127.0.0.1
      - SERVICES=s3,sqs,sns,dynamodb
      - LS_LOG=WARN
    env_file:
      - ./docker/config/defaults.env
    volumes:
      - ./docker/scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "localhost:4566"]
      interval: 5s
      start_period: 5s
      retries: 3

################################################################################
  redis:
    image: redis:7
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "PING" ]
      interval: 5s
      start_period: 2s
      retries: 5


################################################################################
#
# Add the services you want to test below.
#
################################################################################
  waste-submit-reg-packaging-fe:
    image: defradigital/waste-submit-reg-packaging-fe:${WASTE_SUBMIT_REG_PACKAGING_FE:-latest}
    platform: linux/amd64
    env_file:
      - ./docker/config/defaults.env
    environment:
      - PORT=3000
      - SESSION_CACHE_ENGINE=redis
      - SESSION_COOKIE_SECURE=false
      - REDIS_TLS=false
      - ENABLE_SECURE_CONTEXT=false
    depends_on:
      redis:
        condition: service_healthy
    # The name the security scan uses (see zap below). Chromium treats *.localhost as a secure context, so it keeps
    # the app's Secure cookies (the CSRF crumb, the cookie policy) over plain HTTP, as it does for localhost.
    networks:
      default:
        aliases:
          - waste-submit-reg-packaging-fe.localhost
    ports:
      - 8019:3000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 3s
      start_period: 2s
      retries: 10

################################################################################
# OWASP ZAP, the proxy the tests' traffic goes through so it can be scanned (npm run test:security). The browser
# hands each URL to ZAP, which resolves http://waste-submit-reg-packaging-fe.localhost:3000 on this network; to ZAP,
# localhost:8019 would be its own container. The API has no key, so its port is only published on 127.0.0.1.
  zap:
    image: ghcr.io/zaproxy/zaproxy:2.17.0
    command: >-
      zap.sh -daemon -silent -host 0.0.0.0 -port 8080
      -config api.disablekey=true
      -config api.addrs.addr.name=.*
      -config api.addrs.addr.regex=true
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/JSON/core/view/version/"]
      interval: 5s
      start_period: 10s
      retries: 24

